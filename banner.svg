<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="1200" height="320" viewBox="0 0 1200 320">
  <style>
    .mono { font-family: 'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#61dafb"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="14" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="14" fill="url(#grid)"/>

  <!-- window chrome -->
  <rect x="0" y="0" width="1200" height="38" rx="14" fill="#010409"/>
  <rect x="0" y="24" width="1200" height="14" fill="#010409"/>
  <circle cx="26" cy="19" r="6" fill="#ff5f57"/>
  <circle cx="46" cy="19" r="6" fill="#febc2e"/>
  <circle cx="66" cy="19" r="6" fill="#28c840"/>
  <rect x="96" y="8" width="190" height="30" rx="6" fill="#0d1117"/>
  <text x="112" y="28" class="mono" font-size="13" fill="#c9d1d9">kabir.tsx</text>
  <text x="250" y="28" class="mono" font-size="13" fill="#6e7681">×</text>
  <rect x="96" y="36" width="190" height="2" fill="url(#accent)"/>

  <!-- line numbers -->
  <g class="mono" font-size="15" fill="#484f58" text-anchor="end">
    <text x="58" y="88">1</text><text x="58" y="116">2</text><text x="58" y="144">3</text>
    <text x="58" y="172">4</text><text x="58" y="200">5</text><text x="58" y="228">6</text>
    <text x="58" y="256">7</text><text x="58" y="284">8</text>
  </g>

  <!-- code -->
  <g class="mono" font-size="15">
    <text x="80" y="88"><tspan fill="#ff7b72">const</tspan><tspan fill="#d2a8ff"> developer</tspan><tspan fill="#c9d1d9"> = {</tspan></text>
    <text x="80" y="116"><tspan fill="#79c0ff">  name</tspan><tspan fill="#c9d1d9">: </tspan><tspan fill="#a5d6ff">"Muhammad Kabir Kaka"</tspan><tspan fill="#c9d1d9">,</tspan></text>
    <text x="80" y="144"><tspan fill="#79c0ff">  role</tspan><tspan fill="#c9d1d9">: </tspan><tspan fill="#a5d6ff">"Frontend Engineer"</tspan><tspan fill="#c9d1d9">,</tspan></text>
    <text x="80" y="172"><tspan fill="#79c0ff">  stack</tspan><tspan fill="#c9d1d9">: [</tspan><tspan fill="#a5d6ff">"React"</tspan><tspan fill="#c9d1d9">, </tspan><tspan fill="#a5d6ff">"Next.js"</tspan><tspan fill="#c9d1d9">, </tspan><tspan fill="#a5d6ff">"TypeScript"</tspan><tspan fill="#c9d1d9">],</tspan></text>
    <text x="80" y="200"><tspan fill="#79c0ff">  shipped</tspan><tspan fill="#c9d1d9">: </tspan><tspan fill="#79c0ff">30</tspan><tspan fill="#c9d1d9">, </tspan><tspan fill="#8b949e">// production apps, 3+ yrs</tspan></text>
    <text x="80" y="228"><tspan fill="#79c0ff">  location</tspan><tspan fill="#c9d1d9">: </tspan><tspan fill="#a5d6ff">"Karachi, PK"</tspan><tspan fill="#c9d1d9">,</tspan></text>
    <text x="80" y="256"><tspan fill="#79c0ff">  openTo</tspan><tspan fill="#c9d1d9">: </tspan><tspan fill="#a5d6ff">"remote · freelance"</tspan><tspan fill="#c9d1d9">,</tspan></text>
    <text x="80" y="284"><tspan fill="#c9d1d9">};</tspan></text>
  </g>
  <rect class="cursor" x="102" y="270" width="9" height="18" fill="#61dafb"/>

  <!-- right side: name block -->
  <g text-anchor="end">
    <text x="1150" y="150" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="46" font-weight="700" fill="#f0f6fc">Muhammad Kabir Kaka</text>
    <text x="1150" y="190" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="22" fill="url(#accent)" font-weight="600">Frontend Engineer · React · Next.js · TypeScript</text>
    <rect x="910" y="210" width="240" height="3" rx="1.5" fill="url(#accent)"/>
  </g>

  <!-- react atom -->
  <g transform="translate(1080 80)" fill="none" stroke="#61dafb" stroke-width="2" opacity="0.85">
    <ellipse rx="34" ry="13"/>
    <ellipse rx="34" ry="13" transform="rotate(60)"/>
    <ellipse rx="34" ry="13" transform="rotate(120)"/>
    <circle r="5" fill="#61dafb" stroke="none"/>
  </g>

  <!-- status bar -->
  <rect x="0" y="300" width="1200" height="20" fill="#1f6feb" opacity="0.9"/>
  <text x="16" y="314" class="mono" font-size="11" fill="#ffffff">⎇ main   ✓ 0 errors   TypeScript React</text>
  <text x="1184" y="314" class="mono" font-size="11" fill="#ffffff" text-anchor="end">Ln 8, Col 3   UTF-8</text>
</svg>
